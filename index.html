<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vistaro — Mentions legales</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0D0D12;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      max-width: 480px;
      padding: 40px 24px;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #FF6B4A;
    }
    .tagline {
      color: #A1A1AA;
      font-size: 16px;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a {
      display: block;
      padding: 16px 24px;
      background: #161620;
      border: 1px solid #27272F;
      border-radius: 12px;
      color: #FFFFFF;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      transition: border-color 0.2s, background 0.2s;
    }
    a:hover {
      border-color: #FF6B4A;
      background: #1C1C28;
    }
    .footer {
      margin-top: 40px;
      color: #52525B;
      font-size: 13px;
    }
    .footer a {
      display: inline;
      background: none;
      border: none;
      padding: 0;
      color: #A1A1AA;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">📍</div>
    <h1>Vistaro</h1>
    <p class="tagline">Decouvrez les meilleurs spots pres de vous</p>
    <div class="links">
      <a href="cgu.html">Conditions Generales d'Utilisation</a>
      <a href="privacy.html">Politique de Confidentialite</a>
      <a href="cookies.html">Politique Cookies et Stockage Local</a>
      <a href="delete-account.html">Supprimer mon compte</a>
    </div>
    <div class="footer">
      <p>Contact : <a href="mailto:contact@vistaro.fr">contact@vistaro.fr</a></p>
    </div>
  </div>
</body>
</html>
